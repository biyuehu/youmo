name: 构建TypeScript

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# 添加权限配置
permissions:
  contents: write  # 需要写入权限才能提交

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        # 确保获取完整历史以便于推送
        fetch-depth: 0
    
    - name: 设置Bun环境
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: 安装依赖
      run: bun install
      
    - name: 构建TypeScript
      run: bun run build
      
