name: Youmo Signin

on:
  schedule:
    - cron: '0 2,3 * * *'  # UTC 2:00 3:00 (Beijing 10:00 11:00)
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Signin Script
        env:
          BDUSS: ${{ secrets.BDUSS }}
          BATCH_SIZE: ${{ secrets.BATCH_SIZE || '5' }}
          BATCH_INTERVAL: ${{ secrets.BATCH_INTERVAL || '1000' }}

          FILTER_MODE: ${{ secrets.FILTER_MODE || '' }}
          FILTER_LIST: ${{ secrets.FILTER_LIST || '' }}

          MAX_RETRIES: ${{ secrets.MAX_RETRIES || '3' }}
          RETRY_INTERVAL: ${{ secrets.RETRY_INTERVAL || '5000' }}

          MAKI_URL: ${{ secrets.MAKI_URL }}
          MAKI_TOKEN: ${{ secrets.MAKI_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: bun run signin:prod

      - name: Result
        if: always()
        run: |
          echo "Current time: $(date "+%Y/%m/%d %H:%M:%S")"
          echo "Workflow execution status: ${{ job.status }}"
